server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: iot-dashboard

  datasource:
    url: jdbc:h2:mem:iotdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # Make the browser ask the server before reusing a cached app.js or
  # style.css, so frontend edits show up on a normal reload.
  web:
    resources:
      cache:
        cachecontrol:
          no-cache: true

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

# MQTT Broker configuration (matching ESP32 sketch settings)
mqtt:
  broker: control.aut.utcluj.ro
  port: 11188
