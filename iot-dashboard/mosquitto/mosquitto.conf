# Local broker for working without the faculty broker.
# Mosquitto 2 only listens on localhost unless it is told otherwise, and the
# ESP32 board is another machine on the network.
listener 1883 0.0.0.0

# No accounts, like the faculty broker. Anybody on your network can publish to
# any device's command topic. Fine on a home network, not on a public one.
allow_anonymous true

# Nothing is kept across a restart.
persistence false
